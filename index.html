<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คอินและแผนที่</title>
    <style>
        /* รีเซ็ตขอบหน้าจอไม่ให้มีพื้นที่ว่าง */
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div style="overflow: hidden; width: 100%; height: 100vh;">
      <iframe 
        id="myApp"
        src="" 
        allow="geolocation" 
        style="width: 100%; height: calc(100% + 50px); border: none; margin-top: -45px;" 
        scrolling="yes">
      </iframe>
    </div>

    <script>
        // 1. ใส่ลิงก์หลัก Apps Script ของคุณครู (ไม่ต้องใส่ ?page...)
        var baseUrl = "https://script.google.com/a/strisuksa.ac.th/macros/s/AKfycbyaKSn-_8aBXHEUfzzI59tZkSuvNWJW-4RYb6jMRStFjS1Ez7dhPoezhDa4DeH2XuDtMQ/exec";
        
        // 2. ดึงข้อความที่ต่อท้ายลิงก์ GitHub (เช่น ?page=map&room=employees401)
        var queryString = window.location.search;
        
        // 3. นำลิงก์หลัก มาต่อกับข้อความด้านท้าย แล้วป้อนเข้า iframe
        document.getElementById("myApp").src = baseUrl + queryString;
    </script>

</body>
</html>
